<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ministry of MSME - Udyam Registration Verification</title>
</head>
<body>
  <div id="udyam-verification-portal">
    <h1>Government of India - Ministry of MSME</h1>
    <div class="result-box">
      <span class="label">Udyam Registration Number:</span>
      <span class="value" id="udyam-number">UDYAM-DL-01-0012345</span>
      
      <span class="label">Name of Enterprise:</span>
      <span class="value" id="enterprise-name">Completely Different Corp LLP</span>
      
      <span class="label">PAN:</span>
      <span class="value" id="pan-number">ZZZZZ9999Z</span>
      
      <span class="label">Date of Registration:</span>
      <span class="value" id="reg-date">2018-01-10</span>

      <span class="label">Status:</span>
      <span class="value badge-success" id="status">Active Verified</span>
    </div>
  </div>
</body>
</html>
