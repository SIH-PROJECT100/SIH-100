name: GeM Compliance Platform CI/CD

on:
  push:
    branches: [ main, backend, feature/bharatbid-platform ]
  pull_request:
    branches: [ main, backend ]

jobs:
  verify:
    name: Build, Test & Immutability Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gem_compliance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend-api/package-lock.json

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize PostgreSQL least-privilege roles
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/gem_compliance" -f docker/init-db.sql

      - name: Install dependencies
        working-directory: ./backend-api
        run: npm ci

      # Migrate as postgres superuser — backend_app cannot create tables.
      # Permissions are applied in the next step after tables exist.
      - name: Run Prisma migrations
        working-directory: ./backend-api
        env:
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/gem_compliance?schema=public"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gem_compliance?schema=public"
        run: npx prisma migrate deploy

      # ALTER DEFAULT PRIVILEGES in init-db.sql only covers future tables.
      # Prisma already created the tables, so we must GRANT explicitly now.
      - name: Grant backend_app permissions on migrated tables
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/gem_compliance" \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_readwrite;" \
            -c "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO app_readwrite;"

      - name: Apply Ledger lockdown triggers & constraints
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/gem_compliance" -f backend-api/prisma/sql/ledger_lockdown.sql

      - name: Seed database
        working-directory: ./backend-api
        env:
          DATABASE_URL: "postgresql://backend_app:backend_app_secure_password_2026@localhost:5432/gem_compliance?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/gem_compliance?schema=public"
          JWT_SECRET: "super_secure_jwt_secret_key_for_gem_compliance_2026"
          GEMINI_API_KEY: "mock_gemini_api_key_for_ci"
          DEMO_MODE: "true"
        run: |
          npm run db:seed
          npx tsx scripts/seed_phase9.ts

      - name: Build TypeScript project
        working-directory: ./backend-api
        run: npm run build

      - name: Start backend server in background
        working-directory: ./backend-api
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: "postgresql://backend_app:backend_app_secure_password_2026@localhost:5432/gem_compliance?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/gem_compliance?schema=public"
          JWT_SECRET: "super_secure_jwt_secret_key_for_gem_compliance_2026"
          GEMINI_API_KEY: "mock_gemini_api_key_for_ci"
          RATE_LIMIT_TEST_MODE: "true"
          DEMO_MODE: "true"
        run: |
          npm run dev &
          echo "Waiting for backend server to report healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:4000/health | grep -q "ok"; then
              echo "Server healthy on port 4000"
              break
            fi
            sleep 1
          done

      - name: Run Full Vitest Test Suite (22 test files, 275+ tests)
        working-directory: ./backend-api
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: "postgresql://backend_app:backend_app_secure_password_2026@localhost:5432/gem_compliance?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/gem_compliance?schema=public"
          JWT_SECRET: "super_secure_jwt_secret_key_for_gem_compliance_2026"
          GEMINI_API_KEY: "mock_gemini_api_key_for_ci"
          RATE_LIMIT_TEST_MODE: "true"
          DEMO_MODE: "true"
        run: npm test

      - name: Test Dual-Layer Ledger Immutability (Role + Trigger layers)
        run: |
          # Layer 1: backend_app must be denied UPDATE (no UPDATE grant on ledger_entries)
          UPDATE_OUT=$(psql "postgresql://backend_app:backend_app_secure_password_2026@localhost:5432/gem_compliance" \
            -c "UPDATE ledger_entries SET actor_id='hack' WHERE false;" 2>&1 || true)
          echo "Role-layer output: $UPDATE_OUT"
          if echo "$UPDATE_OUT" | grep -qi "permission denied"; then
            echo "PASS Layer 1 (role grants): UPDATE denied to backend_app"
          else
            echo "FAIL Layer 1: backend_app was NOT denied UPDATE"
            exit 1
          fi

          # Layer 2: temporarily grant UPDATE; trigger must still block it
          psql "postgresql://postgres:postgres@localhost:5432/gem_compliance" \
            -c "GRANT UPDATE, DELETE ON ledger_entries TO backend_app;"

          TRIGGER_OUT=$(psql "postgresql://postgres:postgres@localhost:5432/gem_compliance" \
            -c "SET ROLE backend_app; UPDATE ledger_entries SET actor_id='hack' WHERE id=(SELECT id FROM ledger_entries LIMIT 1);" 2>&1 || true)
          echo "Trigger-layer output: $TRIGGER_OUT"
          if echo "$TRIGGER_OUT" | grep -qi "append-only\|insufficient_privilege\|ledger_entries"; then
            echo "PASS Layer 2 (trigger): UPDATE rejected by trigger"
          else
            echo "FAIL Layer 2: trigger did not fire"
            exit 1
          fi

          # Restore: revoke the temporary grant
          psql "postgresql://postgres:postgres@localhost:5432/gem_compliance" \
            -c "REVOKE UPDATE, DELETE ON ledger_entries FROM backend_app;"

          echo "Dual-layer ledger immutability verified."

      - name: Run Phase 12 Baseline Replay Script
        working-directory: ./backend-api
        shell: pwsh
        run: |
          ./test_phase12.ps1

      - name: Run Headless Walkthroughs (Phases 5, 6, 8)
        working-directory: ./backend-api
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://backend_app:backend_app_secure_password_2026@localhost:5432/gem_compliance?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/gem_compliance?schema=public"
          JWT_SECRET: "super_secure_jwt_secret_key_for_gem_compliance_2026"
          GEMINI_API_KEY: "mock_gemini_api_key_for_ci"
          DEMO_MODE: "true"
        run: |
          npx tsx scripts/run_walkthrough_phase5.ts
          npx tsx scripts/run_walkthrough_phase6.ts
          npx tsx scripts/run_walkthrough_phase8.ts
          echo "All headless phase walkthroughs completed successfully."